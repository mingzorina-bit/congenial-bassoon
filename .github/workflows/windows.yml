name: Windows prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure core
        run: cmake -S . -B build -A x64
      - name: Build core
        run: cmake --build build --config Release
      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '8.0.425'
      - name: Test Host keyboard routing
        run: dotnet run --project tests/HostRoutingTests/HostRoutingTests.csproj -c Release
      - name: Test onboarding and preferences
        run: dotnet run --project tests/OnboardingTests/OnboardingTests.csproj -c Release
      - name: Test current expression ranges
        run: dotnet run --project tests/ExpressionTests/ExpressionTests.csproj -c Release
      - name: Test details and pronunciation
        run: dotnet run --project tests/DetailTests/DetailTests.csproj -c Release
      - name: Test learning and privacy
        run: dotnet run --project tests/LearningTests/LearningTests.csproj -c Release
      - name: Test AI gateway and provider contract
        run: dotnet run --project tests/ProviderTests/ProviderTests.csproj -c Release
      - name: Build audited Rime without plugins
        shell: pwsh
        run: ./scripts/Prepare-Rime.ps1
      - name: Build real native adapter
        run: |
          cmake -S . -B build -A x64 -DBI_WITH_RIME=ON -DRIME_ROOT="${{ github.workspace }}/.vendor/rime"
          cmake --build build --config Release
      - name: Test real engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Save native verification files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-verification
          path: build/Release/*
          retention-days: 3
      - name: Publish Windows prototype
        shell: pwsh
        run: ./scripts/Package.ps1
      - name: Verify source and file inventory
        shell: pwsh
        run: ./scripts/Audit-Sources.ps1 -PackagePath artifacts/BilingualInput-v0.1.0-alpha-win-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BilingualInput-v0.1.0-alpha-win-x64
          path: artifacts/BilingualInput-v0.1.0-alpha-win-x64.zip
          if-no-files-found: error
          retention-days: 30


